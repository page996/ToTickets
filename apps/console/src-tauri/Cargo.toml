[package]
name = "human-assist-console"
version = "0.1.0"
description = "Local human-in-the-loop console shell"
authors = ["Local Project Contributors"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.88.0"

[lib]
name = "human_assist_console_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.4.1", features = [] }

[dependencies]
serde = { version = "=1.0.219", features = ["derive"] }
tauri = { version = "=2.8.5", features = [] }
